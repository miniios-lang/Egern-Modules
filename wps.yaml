name: "WPS 签到模块"
description: "WPS 自动获取 Cookie + 每日签到（支持 UI 开关）"
author: "miniios"
icon: "checkmark.seal.fill"

env_schema:
  ENABLE_COOKIE:
    name: "启用 Cookie 获取"
    description: "用于抓取 WPS Cookie"
    options:
      - "true"
      - "false"
  ENABLE_SIGN:
    name: "启用自动签到"
    description: "每日自动执行签到任务"
    options:
      - "true"
      - "false"

mitm:
  hostnames:
    includes:
      - personal-act.wps.cn

scriptings:
  - http_request:
      name: "WPS Cookie"
      match: "^https:\\/\\/personal-act\\.wps\\.cn\\/activity-rubik\\/activity\\/page_info"
      script_url: "https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/wps/wps.cookie.js"
      timeout: 60
      body_required: false
      enabled: "{{{ENABLE_COOKIE}}}"

  - schedule:
      name: "WPS 签到"
      cron: "0 10 * * *"
      script_url: "https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/wps/wps.js"
      timeout: 120
      enabled: "{{{ENABLE_SIGN}}}"
