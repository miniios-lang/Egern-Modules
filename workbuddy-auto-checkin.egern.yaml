# =============================================================================
# WorkBuddy 自动化模块 (Egern)
# 功能:
#   1. 自动获取 / 刷新 Token (OAuth 设备流登录 + refreshToken 自动续期)
#   2. 定时签到 (按 cron 执行, 记录成功/失败与响应信息, 发送通知)
#   3. 多账号支持 (每个账号独立刷新 + 签到, 互不干扰)
#
# 接口依据: https://github.com/Sliverkiss/workbuddy2api
# 模块规范: https://egernapp.com/zh-CN/docs/configuration/modules
#           https://egernapp.com/zh-CN/docs/configuration/scriptings
#
# 导入方式:
#   在 Egern 主配置的 modules 中引用本文件 (本地路径或远程 URL)。
#   例如:
#     modules:
#       - url: "/绝对路径/workbuddy-egern-module/workbuddy.module.yaml"
#         enabled: true
#   启用后, 在模块设置面板填写账号凭证与定时规则即可。
#
# 首次使用 (二选一):
#   A. 运行「WorkBuddy 登录 (添加账号)」脚本 → 浏览器登录 → 再次运行完成绑定
#      (账号保存在脚本持久化存储 wb_accounts_v1, 无需手动填 JSON)
#   B. 直接在模块设置面板把 ACCOUNTS_JSON 填成账号数组 (见下方说明)
# =============================================================================

name: "WorkBuddy 自动化 (签到 / Token)"
description: "自动刷新 WorkBuddy 认证 Token 并按 Cron 定时为多账号执行每日签到，记录结果并通知。"
author: "WorkBuddy Automation"
homepage: "https://github.com/Sliverkiss/workbuddy2api"
icon: "checkmark.circle.fill"

# -----------------------------------------------------------------------------
# 模块参数默认值 (可在模块设置面板中覆盖)。
# 加载时 {{{...}}} 占位符会被替换为下方声明的默认值或用户覆盖值。
# -----------------------------------------------------------------------------
compat_arguments:
  CHECKIN_CRON: "0 9 * * *"        # 每日 09:00 签到。支持标准 5 字段(分 时 日 月 周)或 6 字段(秒 分 时 日 月 周)
  ACCOUNTS_JSON: "[]"              # 多账号凭证 JSON 数组; 留空 [] 则使用登录脚本写入的存储账号
  NOTIFY: "true"                   # 是否发送签到结果通知: true / false
  REGION_DEFAULT: "cn"             # 默认区服: cn (copilot.tencent.com / codebuddy.cn) 或 global (workbuddy.ai)
  LOG_RETENTION: "30"              # 签到日志在持久化存储中保留的条数

# 模块设置面板 UI (Egern 依据 env_schema 自动生成控件)
env_schema:
  ACCOUNTS_JSON:
    name: "账号凭证 (JSON 数组)"
    description: "留空 [] 则使用登录脚本写入的账号；或粘贴 [{\"uid\":\"\",\"refreshToken\":\"\",\"enterpriseId\":\"\",\"domain\":\"\",\"label\":\"账号1\"}]"
    default_value: "[]"
  NOTIFY:
    name: "签到结果通知"
    options:
      - "true"
      - "false"
  REGION_DEFAULT:
    name: "默认区服"
    options:
      - "cn"
      - "global"
  LOG_RETENTION:
    name: "签到日志保留条数"
    default_value: "30"

scriptings:
  # ---------------------------------------------------------------------------
  # 1) 定时签到 (核心): 读取多账号 → 必要时用 refreshToken 刷新 → 签到 → 记录 → 通知
  # ---------------------------------------------------------------------------
  - schedule:
      name: "WorkBuddy 每日签到"
      cron: "{{{CHECKIN_CRON}}}"
      script_text: |
        // =============================================================================
        // WorkBuddy 每日签到脚本 (Egern schedule)
        // -----------------------------------------------------------------------------
        // 功能:
        //   - 读取多账号 (优先级: 配置 ACCOUNTS_JSON > 脚本持久化存储 wb_accounts_v1)
        //   - 必要时用 refreshToken 自动刷新 accessToken (过期前 5 分钟或缺失时刷新)
        //   - 逐个执行每日签到 (POST /v2/billing/meter/daily-checkin)
        //   - 记录签到结果 (成功/失败 + 响应信息) 到 wb_checkin_log_v1
        //   - 发送汇总通知
        //
        // 接口依据: https://github.com/Sliverkiss/workbuddy2api
        //   refresh: POST {chatBase}/v2/plugin/auth/token/refresh
        //   checkin: POST {billingBase}/v2/billing/meter/daily-checkin
        // =============================================================================

        const STORE_ACCOUNTS = 'wb_accounts_v1';
        const STORE_LOG = 'wb_checkin_log_v1';

        // 区服判定: domain 为 workbuddy.ai 视为 global, 否则 cn
        function isGlobal(domain) {
          return !!(domain && (domain === 'workbuddy.ai' || domain.endsWith('.workbuddy.ai')));
        }
        function chatBaseFor(domain) {
          return isGlobal(domain) ? 'https://www.workbuddy.ai' : 'https://copilot.tencent.com';
        }
        function billingBaseFor(acct) {
          return isGlobal(acct && acct.domain) ? 'https://www.workbuddy.ai' : 'https://www.codebuddy.cn';
        }
        function originFor(domain) {
          return isGlobal(domain) ? 'https://www.workbuddy.ai' : 'https://www.codebuddy.cn';
        }
        function commonHeaders(origin) {
          return {
            'Content-Type': 'application/json',
            'Accept': 'application/json, text/plain, */*',
            'X-Requested-With': 'XMLHttpRequest',
            'Origin': origin,
            'Referer': origin + '/',
            'User-Agent': 'CLI/2.63.2 CodeBuddy/2.63.2'
          };
        }

        // 统一解析响应: 返回 { status, json, text }
        async function parseResp(resp) {
          let text = '';
          try { text = await resp.text(); } catch (e) { text = ''; }
          let json = null;
          try { json = JSON.parse(text); } catch (e) { json = null; }
          return { status: resp.status, json: json, text: text };
        }

        // 解信封: 返回 data 字段 (WorkBuddy 统一 {code,msg,data})
        function unwrap(json) {
          if (!json) return null;
          if (typeof json.code === 'number' && json.data !== undefined) return json.data;
          return json;
        }

        // -----------------------------------------------------------------------------
        // 刷新 accessToken
        //   端点: POST {chatBase}/v2/plugin/auth/token/refresh
        //   关键头: X-Refresh-Token, X-Enterprise-Id, X-Auth-Refresh-Source
        // -----------------------------------------------------------------------------
        async function refreshToken(ctx, acct) {
          const base = chatBaseFor(acct.domain);
          const headers = commonHeaders(originFor(acct.domain));
          headers['X-Refresh-Token'] = acct.refreshToken;
          if (acct.enterpriseId) headers['X-Enterprise-Id'] = acct.enterpriseId;
          headers['X-Auth-Refresh-Source'] = 'workbuddy';

          const resp = await ctx.http.post(base + '/v2/plugin/auth/token/refresh', {
            headers: headers,
            body: '',
            timeout: 15000
          });
          const { status, json } = await parseResp(resp);

          if (status >= 500) throw new Error('刷新服务异常 HTTP ' + status);
          if (status >= 400) {
            const msg = (json && json.msg) ? json.msg : '';
            throw new Error('刷新失败 HTTP ' + status + ' ' + String(msg).slice(0, 120));
          }
          const data = unwrap(json);
          if (!data || !data.accessToken) {
            throw new Error('刷新响应缺少 accessToken, 可能需要重新登录');
          }
          acct.accessToken = data.accessToken;
          if (data.refreshToken) acct.refreshToken = data.refreshToken;
          if (data.domain) acct.domain = data.domain;
          if (data.expiresIn && data.expiresIn > 0) {
            acct.expiresAt = Math.floor(Date.now() / 1000) + data.expiresIn;
          }
          return acct;
        }

        // -----------------------------------------------------------------------------
        // 每日签到
        //   端点: POST {billingBase}/v2/billing/meter/daily-checkin  body: {}
        //   头: Authorization: Bearer, X-User-Id, X-Enterprise-Id, X-Tenant-Id, X-Domain
        //   响应: {code:0,msg,data} 成功; 已签到业务码(如 10001)视为今日已签
        // -----------------------------------------------------------------------------
        async function dailyCheckin(ctx, acct) {
          const base = billingBaseFor(acct);
          const headers = {
            'Authorization': 'Bearer ' + acct.accessToken,
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          };
          if (acct.uid) headers['X-User-Id'] = acct.uid;
          if (acct.enterpriseId) {
            headers['X-Enterprise-Id'] = acct.enterpriseId;
            headers['X-Tenant-Id'] = acct.enterpriseId;
          }
          if (acct.domain) headers['X-Domain'] = acct.domain;

          const resp = await ctx.http.post(base + '/v2/billing/meter/daily-checkin', {
            headers: headers,
            body: '{}',
            timeout: 15000
          });
          const { status, json } = await parseResp(resp);

          if (status >= 500) throw new Error('签到服务异常 HTTP ' + status);
          if (status >= 400) {
            // 已签到等业务错误也可能走 4xx
            const msg = (json && json.msg) ? json.msg : ('HTTP ' + status);
            if (/已签到|already|今天|重复|10001/i.test(msg)) return { ok: true, msg: '今日已签到' };
            return { ok: false, msg: String(msg).slice(0, 120) };
          }
          if (json && typeof json.code === 'number' && json.code === 0) {
            return { ok: true, msg: '签到成功' };
          }
          const msg = (json && json.msg) ? json.msg : '未知响应';
          if (/已签到|already|今天|重复|10001/i.test(msg)) return { ok: true, msg: '今日已签到' };
          return { ok: false, msg: String(msg).slice(0, 120) };
        }

        // -----------------------------------------------------------------------------
        // 持久化存储辅助
        // -----------------------------------------------------------------------------
        function loadAccounts(ctx) {
          const s = ctx.storage.get(STORE_ACCOUNTS);
          if (!s) return [];
          try { const a = JSON.parse(s); return Array.isArray(a) ? a : []; } catch (e) { return []; }
        }
        function saveAccounts(ctx, arr) {
          ctx.storage.set(STORE_ACCOUNTS, JSON.stringify(arr));
        }
        function loadLog(ctx) {
          const s = ctx.storage.get(STORE_LOG);
          if (!s) return [];
          try { const a = JSON.parse(s); return Array.isArray(a) ? a : []; } catch (e) { return []; }
        }
        function appendLog(ctx, entry, retention) {
          const log = loadLog(ctx);
          log.unshift(entry);
          if (log.length > retention) log.length = retention;
          ctx.storage.set(STORE_LOG, JSON.stringify(log));
        }

        // -----------------------------------------------------------------------------
        // 主流程
        // -----------------------------------------------------------------------------
        export default async function (ctx) {
          const env = ctx.env || {};
          const notify = (env.NOTIFY || 'true') !== 'false';
          const retention = Math.max(1, parseInt(env.LOG_RETENTION || '30', 10) || 30);

          // 解析账号: 优先 ACCOUNTS_JSON, 否则用存储
          let accounts = [];
          const envRaw = env.ACCOUNTS_JSON;
          if (envRaw && envRaw.trim() && envRaw.trim() !== '[]') {
            try { const a = JSON.parse(envRaw); if (Array.isArray(a)) accounts = a; } catch (e) { /* 忽略解析错误 */ }
          }
          if (!accounts.length) accounts = loadAccounts(ctx);

          if (!accounts.length) {
            if (notify) ctx.notify({
              title: 'WorkBuddy 签到',
              body: '未检测到账号。\n请先运行「WorkBuddy 登录 (添加账号)」脚本, 或在配置面板填写 ACCOUNTS_JSON。'
            });
            return;
          }

          const results = [];
          for (const acct of accounts) {
            const label = acct.label || acct.nickname || acct.uid || '未知账号';
            try {
              const now = Math.floor(Date.now() / 1000);
              const needRefresh = !acct.accessToken || !acct.refreshToken ||
                !acct.expiresAt || (acct.expiresAt - now) < 300;
              if (needRefresh) {
                if (!acct.refreshToken) throw new Error('缺少 refreshToken, 请重新登录');
                await refreshToken(ctx, acct);
              }
              const r = await dailyCheckin(ctx, acct);
              results.push({ label: label, ok: r.ok, msg: r.msg });
              appendLog(ctx, { uid: acct.uid || '', label: label, ts: Date.now(), ok: r.ok, msg: r.msg }, retention);
            } catch (e) {
              results.push({ label: label, ok: false, msg: e.message });
              appendLog(ctx, { uid: acct.uid || '', label: label, ts: Date.now(), ok: false, msg: e.message }, retention);
            }
          }

          // 持久化刷新后的 token (便于后续以存储方式复用)
          saveAccounts(ctx, accounts);

          const okCount = results.filter(r => r.ok).length;
          const summary = results.map(r => (r.ok ? '✓ ' : '✗ ') + r.label + ': ' + r.msg).join('\n');
          if (notify) {
            ctx.notify({ title: 'WorkBuddy 签到 ' + okCount + '/' + results.length, body: summary });
          }
        }
      env:
        ACCOUNTS_JSON: "{{{ACCOUNTS_JSON}}}"
        NOTIFY: "{{{NOTIFY}}}"
        REGION_DEFAULT: "{{{REGION_DEFAULT}}}"
        LOG_RETENTION: "{{{LOG_RETENTION}}}"
      timeout: 60
      update_interval: 86400

  # ---------------------------------------------------------------------------
  # 2) 登录 / 添加账号 (手动触发): OAuth 设备流, 浏览器登录后写入持久化存储
  # ---------------------------------------------------------------------------
  - generic:
      name: "WorkBuddy 登录 (添加账号)"
      script_text: |
        // =============================================================================
        // WorkBuddy 登录脚本 (Egern generic, 手动触发) — 添加 / 绑定账号
        // -----------------------------------------------------------------------------
        // OAuth 设备流 (无 PKCE, state 由服务端签发), 与 workbuddy2api 登录逻辑一致:
        //   1. POST {chatBase}/v2/plugin/auth/state?platform=CLI  → 拿到 state + authUrl
        //       (state 暂存于 wb_login_state_v1, 并推送授权链接给用户)
        //   2. 用户在浏览器完成登录后, 再次运行本脚本:
        //      GET  {chatBase}/v2/plugin/auth/token?state=     → accessToken / refreshToken / expiresIn / domain
        //      GET  {chatBase}/v2/plugin/login/account?state=  → uid / enterpriseId / nickname
        //   3. 账号写入持久化存储 wb_accounts_v1, 供签到脚本读取 (多账号互不影响)
        // =============================================================================

        const STORE_ACCOUNTS = 'wb_accounts_v1';
        const STORE_STATE = 'wb_login_state_v1';

        function isGlobal(domain) {
          return !!(domain && (domain === 'workbuddy.ai' || domain.endsWith('.workbuddy.ai')));
        }
        function chatBaseFor(domain) {
          return isGlobal(domain) ? 'https://www.workbuddy.ai' : 'https://copilot.tencent.com';
        }
        function originFor(domain) {
          return isGlobal(domain) ? 'https://www.workbuddy.ai' : 'https://www.codebuddy.cn';
        }
        function commonHeaders(origin) {
          return {
            'Content-Type': 'application/json',
            'Accept': 'application/json, text/plain, */*',
            'X-Requested-With': 'XMLHttpRequest',
            'Origin': origin,
            'Referer': origin + '/',
            'User-Agent': 'CLI/2.63.2 CodeBuddy/2.63.2'
          };
        }
        async function parseResp(resp) {
          let text = '';
          try { text = await resp.text(); } catch (e) { text = ''; }
          let json = null;
          try { json = JSON.parse(text); } catch (e) { json = null; }
          return { status: resp.status, json: json, text: text };
        }
        function unwrap(json) {
          if (!json) return null;
          if (typeof json.code === 'number' && json.data !== undefined) return json.data;
          return json;
        }
        function loadAccounts(ctx) {
          const s = ctx.storage.get(STORE_ACCOUNTS);
          if (!s) return [];
          try { const a = JSON.parse(s); return Array.isArray(a) ? a : []; } catch (e) { return []; }
        }
        function saveAccounts(ctx, arr) {
          ctx.storage.set(STORE_ACCOUNTS, JSON.stringify(arr));
        }

        export default async function (ctx) {
          const env = ctx.env || {};
          const region = env.REGION_DEFAULT === 'global' ? 'workbuddy.ai' : '';
          const base = chatBaseFor(region);
          const origin = originFor(region);

          const pending = ctx.storage.get(STORE_STATE);

          // ---- 第一步: 申请 state + 授权链接 ----
          if (!pending) {
            const headers = commonHeaders(origin);
            const resp = await ctx.http.post(base + '/v2/plugin/auth/state?platform=CLI', {
              headers: headers,
              body: '{}',
              timeout: 15000
            });
            const { status, json } = await parseResp(resp);
            if (status >= 400 || !json) throw new Error('获取授权链接失败 HTTP ' + status);

            const data = unwrap(json);
            if (!data || !data.state) throw new Error('响应缺少 state');

            ctx.storage.set(STORE_STATE, JSON.stringify({ state: data.state, ts: Date.now() }));
            ctx.notify({
              title: 'WorkBuddy 登录 (1/2)',
              body: '请在浏览器打开下方链接完成登录, 然后再次运行本脚本完成绑定:\n' + (data.authUrl || '(未返回 authUrl)')
            });
            return;
          }

          // ---- 第二步: 轮询 token (pending 存在) ----
          const p = (function () { try { return JSON.parse(pending); } catch (e) { return {}; } })();
          if (!p.state) {
            ctx.storage.delete(STORE_STATE);
            ctx.notify({ title: 'WorkBuddy 登录', body: '登录状态损坏, 请重新运行本脚本。' });
            return;
          }

          const headers = commonHeaders(origin);
          const resp = await ctx.http.get(base + '/v2/plugin/auth/token?state=' + encodeURIComponent(p.state), {
            headers: headers,
            timeout: 15000
          });
          const { status, json } = await parseResp(resp);

          // pending 时业务 code 非 0 (如 "login ing"), 或 HTTP 非 2xx → 视为未完成
          if (status >= 400 || !json) {
            ctx.notify({ title: 'WorkBuddy 登录', body: '登录尚未完成, 请先在浏览器完成登录后重试。' });
            return;
          }
          const data = unwrap(json);
          if (!data || !data.accessToken) {
            ctx.notify({ title: 'WorkBuddy 登录', body: '登录尚未完成 (waiting)。请确认已在浏览器完成登录, 然后再次运行本脚本。' });
            return;
          }

          // ---- 获取账号信息 (uid / enterpriseId / nickname) ----
          let acctInfo = {};
          try {
            const ah = commonHeaders(origin);
            ah['Authorization'] = 'Bearer ' + data.accessToken;
            const ar = await ctx.http.get(base + '/v2/plugin/login/account?state=' + encodeURIComponent(p.state), {
              headers: ah,
              timeout: 15000
            });
            const ap = await parseResp(ar);
            if (ap.json) acctInfo = unwrap(ap.json) || {};
          } catch (e) { /* 忽略, 使用默认值 */ }

          const accounts = loadAccounts(ctx);
          const acct = {
            label: acctInfo.nickname || ('账号' + (accounts.length + 1)),
            uid: acctInfo.uid || '',
            enterpriseId: acctInfo.enterpriseId || '',
            nickname: acctInfo.nickname || '',
            accessToken: data.accessToken,
            refreshToken: data.refreshToken || '',
            expiresAt: Math.floor(Date.now() / 1000) + (data.expiresIn || 0),
            domain: data.domain || region
          };

          // 去重 (按 uid); 无 uid 则追加
          const idx = accounts.findIndex(a => a.uid && a.uid === acct.uid);
          if (idx >= 0) accounts[idx] = acct; else accounts.push(acct);
          saveAccounts(ctx, accounts);
          ctx.storage.delete(STORE_STATE);

          ctx.notify({
            title: 'WorkBuddy 登录成功 (2/2)',
            body: '已保存账号: ' + (acct.nickname || acct.uid) + '\n当前共 ' + accounts.length + ' 个账号。'
          });
        }
      env:
        REGION_DEFAULT: "{{{REGION_DEFAULT}}}"
      timeout: 30

  # ---------------------------------------------------------------------------
  # 3) 查看账号与签到状态 (手动触发)
  # ---------------------------------------------------------------------------
  - generic:
      name: "WorkBuddy 状态查看"
      script_text: |
        // =============================================================================
        // WorkBuddy 状态查看脚本 (Egern generic, 手动触发)
        // -----------------------------------------------------------------------------
        // 展示当前已绑定账号 (来自 wb_accounts_v1) 与最近签到记录 (来自 wb_checkin_log_v1)。
        // =============================================================================

        const STORE_ACCOUNTS = 'wb_accounts_v1';
        const STORE_LOG = 'wb_checkin_log_v1';

        function loadAccounts(ctx) {
          const s = ctx.storage.get(STORE_ACCOUNTS);
          if (!s) return [];
          try { const a = JSON.parse(s); return Array.isArray(a) ? a : []; } catch (e) { return []; }
        }
        function loadLog(ctx) {
          const s = ctx.storage.get(STORE_LOG);
          if (!s) return [];
          try { const a = JSON.parse(s); return Array.isArray(a) ? a : []; } catch (e) { return []; }
        }

        export default async function (ctx) {
          const accounts = loadAccounts(ctx);
          const log = loadLog(ctx).slice(0, 8);

          let body = '账号数量: ' + accounts.length + '\n';
          accounts.forEach((a, i) => {
            const exp = a.expiresAt ? new Date(a.expiresAt * 1000).toLocaleString() : '未知';
            const hasToken = a.accessToken ? '✓' : '✗';
            const hasRefresh = a.refreshToken ? '✓' : '✗';
            body += (i + 1) + '. ' + (a.label || a.uid || '?') +
              '  uid=' + (a.uid || '-') +
              '  token=' + hasToken + ' refresh=' + hasRefresh +
              '  过期=' + exp + '\n';
          });

          body += '\n最近签到记录:\n';
          if (!log.length) {
            body += '(无)';
          } else {
            log.forEach(l => {
              const t = new Date(l.ts).toLocaleString();
              body += t + '  ' + (l.label || '') + ': ' + (l.ok ? '✓ ' : '✗ ') + (l.msg || '') + '\n';
            });
          }

          ctx.notify({ title: 'WorkBuddy 状态', body: body });
        }
      timeout: 30
