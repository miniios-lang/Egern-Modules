name: "九号出行签到"
description: "自动签到领N币 · Token抓取（带开关 + 可自定义时间）"
author: "凉心"
icon: "bicycle"

# 👉 Surge arguments → Egern 兼容参数
compat_arguments:
  CronExp: "10 8 * * *"

compat_arguments_desc: |
  CronExp: 签到时间（Cron 表达式）
  示例：10 8 * * * = 每天 08:10

# 👉 UI 开关（Egern 自动生成）
env_schema:
  ENABLE_HEADER:
    name: Token 抓取
    description: 打开 App 签到页自动抓取 Header
    options:
      - "true"
      - "false"

  ENABLE_SIGN:
    name: 自动签到
    description: 定时执行签到任务
    options:
      - "true"
      - "false"

# 👉 MITM
mitm:
  hostnames:
    - cn-cbu-gateway.ninebot.com

# 👉 脚本
scriptings:
  - http_request:
      name: "Ninebot Token 抓取"
      match: "^https:\\/\\/cn-cbu-gateway\\.ninebot\\.com\\/(portal|app-api)\\/api\\/user-sign\\/"
      script_url: "https://raw.githubusercontent.com/52Lxcloud/ScriptKit/main/Scripts/ninebot.js"
      timeout: 60
      enable: "{{{ENABLE_HEADER}}}"

  - schedule:
      name: "Ninebot 自动签到"
      cron: "{{{CronExp}}}"
      script_url: "https://raw.githubusercontent.com/52Lxcloud/ScriptKit/main/Scripts/ninebot.js"
      timeout: 60
      enable: "{{{ENABLE_SIGN}}}"